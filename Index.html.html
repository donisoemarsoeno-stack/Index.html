
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keuangan Doni Pro+</title>
<style>
body{font-family:Arial;margin:0;padding:20px;background:#f5f5f5}
.card{background:white;padding:20px;border-radius:10px;max-width:1100px;margin:auto}
input,select,button{padding:8px;margin:4px}
table{width:100%;border-collapse:collapse;margin-top:15px}
th,td{border:1px solid #ddd;padding:8px}
.dark{background:#1e1e1e;color:white}
.dark .card{background:#2d2d2d;color:white}
</style>
</head>
<body>
<div class="card">
<h1>Keuangan Doni Pro+</h1>

<button onclick="toggleDark()">🌙 Dark Mode</button>
<button onclick="backup()">💾 Backup</button>
<input type="file" id="restoreFile" onchange="restore(event)">

<h3>Transaksi</h3>
<input type="date" id="tgl">
<select id="jenis">
<option>Pemasukan</option>
<option>Pengeluaran</option>
<option>Hutang</option>
<option>Piutang</option>
</select>
<input id="ket" placeholder="Keterangan">
<input id="nominal" type="number" placeholder="Nominal">
<button onclick="tambah()">Tambah</button>

<h3>Ringkasan</h3>
<p>Pemasukan: Rp <span id="masuk">0</span></p>
<p>Pengeluaran: Rp <span id="keluar">0</span></p>
<p>Hutang: Rp <span id="hutang">0</span></p>
<p>Piutang: Rp <span id="piutang">0</span></p>
<p><b>Saldo: Rp <span id="saldo">0</span></b></p>

<table>
<thead>
<tr><th>Tanggal</th><th>Jenis</th><th>Keterangan</th><th>Nominal</th></tr>
</thead>
<tbody id="tb"></tbody>
</table>

<canvas id="chart"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
let data=JSON.parse(localStorage.getItem("doniProPlus")||"[]");

function tambah(){
data.push({
tgl:tgl.value,
jenis:jenis.value,
ket:ket.value,
nominal:+nominal.value
});
simpan();
}

function simpan(){
localStorage.setItem("doniProPlus",JSON.stringify(data));
render();
}

function render(){
let m=0,k=0,h=0,p=0;
tb.innerHTML="";
data.forEach(d=>{
if(d.jenis=="Pemasukan")m+=d.nominal;
if(d.jenis=="Pengeluaran")k+=d.nominal;
if(d.jenis=="Hutang")h+=d.nominal;
if(d.jenis=="Piutang")p+=d.nominal;
tb.innerHTML+=`<tr><td>${d.tgl}</td><td>${d.jenis}</td><td>${d.ket}</td><td>${d.nominal.toLocaleString()}</td></tr>`;
});
masuk.innerText=m.toLocaleString();
keluar.innerText=k.toLocaleString();
hutang.innerText=h.toLocaleString();
piutang.innerText=p.toLocaleString();
saldo.innerText=(m-k).toLocaleString();

if(window.grafik) grafik.destroy();
grafik=new Chart(chart,{
type:'pie',
data:{labels:['Pemasukan','Pengeluaran','Hutang','Piutang'],
datasets:[{data:[m,k,h,p]}]}
});
}

function backup(){
const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
const a=document.createElement('a');
a.href=URL.createObjectURL(blob);
a.download='backup_keuangan_doni.json';
a.click();
}

function restore(e){
const f=e.target.files[0];
const r=new FileReader();
r.onload=()=>{
data=JSON.parse(r.result);
simpan();
};
r.readAsText(f);
}

function toggleDark(){
document.body.classList.toggle('dark');
}

render();
</script>
</body>
</html>
